# Netlify configuration for JammuKhoj
[build]
  publish = "dist"
  command = "npm run build"

# Redirect apex domain to www or vice versa, and SPA routing fallback
[[redirects]]
  from = "https://bucolic-buttercream-966135.netlify.app/*"
  to = "https://jammukhoj.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/bundle/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
